<style>
html,body{margin:0;min-height:100%;background:#321c18;color:#f5e8d6;font-family:Georgia,serif}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh}
.load{text-align:center;padding:24px;max-width:420px}
.load h1{font-weight:400;font-size:clamp(30px,7vw,42px);margin:0 0 16px}
.load p{font:14px/1.6 system-ui,sans-serif;color:#ddcbb8}
.spin{width:27px;height:27px;border:2px solid #886a5d;border-top-color:#f4d6ac;border-radius:50%;animation:r .8s linear infinite;margin:28px auto}
@keyframes r{to{transform:rotate(360deg)}}

<body>
<main class="load" id="load" role="status" aria-live="polite">
  <h1>Wahyu &amp; Sukma</h1>
  <p>Memuat undangan pernikahan…</p>
  <div class="spin" aria-hidden="true"></div>
</main>
<script>
/* Halaman pratinjau ringan. Isi undangan lengkap tetap berada di satu HTML di dalam undangan.zip. */
(async function () {
  const el = document.getElementById('load');
  try {
    if (typeof DecompressionStream !== 'function') throw new Error('Browser ini belum mendukung pembukaan ZIP otomatis. Gunakan browser terbaru.');
    const response = await fetch('./undangan.zip', {cache:'no-cache'});
    if (!response.ok) throw new Error('undangan.zip tidak dapat diakses (HTTP ' + response.status + ').');
    const buff = await response.arrayBuffer();
    const dv = new DataView(buff);
    if (dv.byteLength < 30 || dv.getUint32(0, true) !== 0x04034b50) throw new Error('Format undangan.zip tidak sesuai.');
    const flags = dv.getUint16(6, true);
    const method = dv.getUint16(8, true);
    const size = dv.getUint32(18, true);
    const fnameLen = dv.getUint16(26, true);
    const extraLen = dv.getUint16(28, true);
    const offset = 30 + fnameLen + extraLen;
    if (flags & 1 || flags & 8 || method !== 8 || !size || offset + size > buff.byteLength) {
      throw new Error('ZIP harus berisi satu file HTML dengan kompresi standar DEFLATE.');
    }
    const name = new TextDecoder().decode(new Uint8Array(buff, 30, fnameLen));
    if (name !== 'undangan.html') throw new Error('File undangan.html tidak ditemukan di dalam ZIP.');
    const compressed = new Uint8Array(buff, offset, size);
    const rawStream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const uncompressedHtml = await new Response(rawStream).text();
    if (!uncompressedHtml.toLowerCase().includes('<!doctype html>')) throw new Error('Isi HTML undangan tidak valid.');
    document.open();
    document.write(uncompressedHtml);
    document.close();
  } catch(err) {
    el.innerHTML = '<h1>Wahyu &amp; Sukma</h1><p>Undangan belum bisa dimuat.</p><p id="load-error"></p>';
    document.getElementById('load-error').textContent = err.message;
    console.error('Gagal memuat undangan:', err);
  }
}());
</script>
</body>
