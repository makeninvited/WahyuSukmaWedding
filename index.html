:root{--brown:#291915;--cream:#fff3e3;--gold:#d6b68d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--brown)}
body{color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse at 50% 35%,#55372b 0%,#2b1a16 65%,#1d1210 100%)}
.invitation{position:relative;isolation:isolate;overflow:hidden;width:min(100%,600px);height:100svh;height:100dvh;min-height:620px;margin:0 auto;background:#38251e;box-shadow:0 0 100px #12080580}
.photos,.shade{position:absolute;inset:0;pointer-events:none}.photos{overflow:hidden;z-index:-3}
.photo{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:50% 50%}
.shade{z-index:-2;background:linear-gradient(180deg,rgba(31,17,15,.58) 0%,rgba(43,24,19,.25) 22%,rgba(43,24,19,.02) 41%,rgba(43,24,19,.04) 55%,rgba(36,19,16,.60) 74%,rgba(35,17,16,.96) 100%)}
.frame{position:absolute;inset:16px;border:1px solid #e6c8a437;pointer-events:none;z-index:-1}.frame:before,.frame:after{content:"";position:absolute;width:34px;height:34px;border-color:#dcb891;border-style:solid}.frame:before{top:-1px;left:-1px;border-width:1px 0 0 1px}.frame:after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.cover{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:clamp(42px,7svh,78px) 30px max(36px,env(safe-area-inset-bottom));text-align:center}
.heading{width:100%;text-shadow:0 2px 18px #130b08a6}.eyebrow{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.28em;font-weight:400;margin:0 0 17px;padding-left:.28em}
h1{font-family:WeddingScript,cursive;font-weight:400;font-size:clamp(48px,13vw,76px);line-height:.95;margin:0 -8px 9px;white-space:nowrap}
.date{font-size:17px;letter-spacing:.12em;margin:0;line-height:1.6}
.divider{display:flex;align-items:center;justify-content:center;gap:13px;color:var(--gold);margin:16px auto 0;width:145px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#d6b68dbb)}.divider:after{transform:rotate(180deg)}.divider svg{width:26px;height:14px;fill:none;stroke:currentColor;stroke-width:1}
.guest{width:100%;max-width:390px;text-shadow:0 2px 14px #1d0e0a80}.salutation{font-size:16px;margin:0 0 11px;line-height:1.5}.guest-name{font-size:26px;font-weight:400;margin:0 0 12px;line-height:1.25;overflow-wrap:anywhere;white-space:pre-line}.apology{font-size:clamp(8px,2.45vw,10px);line-height:1.4;font-style:italic;white-space:nowrap;width:100%;margin:0 auto;color:#f4e4d6}
.open-button{display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:49px;padding:14px 25px;margin-top:24px;border:1px solid #b975785c;border-radius:5px;color:#fff4e8;background:linear-gradient(135deg,#812936,#631a26);box-shadow:0 6px 22px #19090c50;font-family:Arial,sans-serif;font-size:12px;font-weight:400;letter-spacing:.12em;cursor:pointer}.open-button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.4}
.open-button:hover{background:#8b3040}.open-button:focus-visible{outline:2px solid #fff3e3;outline-offset:6px}
.error{display:none;color:#fff3e3;background:#4b1927d9;line-height:1.5;font:12px/1.5 Arial,sans-serif;margin-top:13px;padding:9px 14px;border-radius:5px}
.error.visible{display:block}
@media(min-width:800px){.invitation{border-left:1px solid #ba8e6140;border-right:1px solid #ba8e6140}.cover{padding-left:44px;padding-right:44px}h1{font-size:76px}}
@media(max-width:359px){.cover{padding-left:22px;padding-right:22px}h1{font-size:46px}.eyebrow{font-size:11px}.salutation{font-size:14px}.guest-name{font-size:24px}.frame{inset:11px}}
@media(max-height:700px){.cover{padding-top:36px;padding-bottom:28px}.eyebrow{margin-bottom:12px}h1{font-size:clamp(46px,13vw,68px)}}

</style>

</head>

<script>
/* Sampul undangan tampil seketika; undangan lengkap disiapkan tanpa layar loading. */
(() => {
 const guestParam = new URLSearchParams(location.search).get('to');
 document.getElementById('guestName').textContent = guestParam && guestParam.trim() ? guestParam.trim().slice(0,160) : 'Nama(tamu)';
 let openRequested = false;
 let ready = false;
 const button = document.getElementById('openInvitation');
 const error = document.getElementById('loadingError');
 button.addEventListener('click', () => {
   if (ready) return;
   openRequested = true;
   // Bila koneksi lambat, klik disimpan sampai undangan lengkap siap dibuka.
 });
 (async () => {
   try {
     if (typeof DecompressionStream !== 'function') throw new Error('Gunakan browser versi terbaru untuk membuka undangan.');
     const response = await fetch('./undangan.zip');
     if (!response.ok) throw new Error('Berkas undangan tidak dapat diakses (HTTP ' + response.status + ').');
     const buff = await response.arrayBuffer();
     const view = new DataView(buff);
     if (view.byteLength < 30 || view.getUint32(0,true) !== 0x04034b50) throw new Error('Format berkas undangan tidak valid.');
     const flags = view.getUint16(6,true), method = view.getUint16(8,true), size = view.getUint32(18,true);
     const fnLen = view.getUint16(26,true), extraLen = view.getUint16(28,true);
     const offset = 30 + fnLen + extraLen;
     if (flags & 1 || flags & 8 || method !== 8 || !size || offset + size > buff.byteLength) throw new Error('undangan.zip harus memuat undangan.html dalam format ZIP standar.');
     const fileName = new TextDecoder().decode(new Uint8Array(buff,30,fnLen));
     if (fileName !== 'undangan.html') throw new Error('File undangan.html tidak ditemukan di dalam ZIP.');
     const compressed = new Uint8Array(buff,offset,size);
     const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
     const html = await new Response(stream).text();
     if (!html.toLowerCase().includes('<!doctype html>')) throw new Error('Isi undangan tidak valid.');
     ready = true;
     document.open(); document.write(html); document.close();
     if (openRequested) {
       const originalButton = document.getElementById('openInvitation');
       if (originalButton) requestAnimationFrame(() => originalButton.click());
     }
   } catch (err) {
     error.textContent = err.message + ' Silakan muat ulang halaman.';
     error.classList.add('visible');
     console.error('Gagal membuka undangan:',err);
   }
 })();
})();
</script>
